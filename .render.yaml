services:
  - type: web
    name: VC1-Group06-Cafe-Shop
    env: php
    buildCommand: "composer install"
    startCommand: "php -S 0.0.0.0:$PORT"
    envVars:
      - key: DB_HOST
        value: your-db-host
      - key: DB_DATABASE
        value: your-db-name
      - key: DB_USERNAME
        value: your-db-username
      - key: DB_PASSWORD
        value: your-db-password
